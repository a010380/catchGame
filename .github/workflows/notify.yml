name: 開賽提醒與賽果推播

on:
  schedule:
    # 每 10 分鐘跑一次，一次同時做兩件事：
    #   1. 推播「即將開賽」（距離開賽 20 分鐘內的比賽）
    #   2. 推播剛結束的比賽比分
    #
    # 為什麼是 10 分鐘：開賽提醒需要比較細的顆粒度，而 GitHub Actions 的
    # 排程不保證準時（尖峰可能延遲 5-15 分鐘）。10 分鐘一次搭配 20 分鐘的
    # 提醒視窗，可以確保每場比賽都會被提醒到，實際送達落在開賽前約 20-5 分鐘。
    #
    # 為什麼兩件事合併：兩個 job 各自 commit 同一個 state.json 會互相衝突，
    # 而且重複的 checkout 與 pip install 純屬浪費。
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  remind-and-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 開賽提醒 + 賽果推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py tick

      - name: Commit 通知紀錄
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "通知紀錄無變化，跳過 commit。"
            exit 0
          fi
          git commit -m "chore: 更新通知紀錄"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗，第 $i 次重試…"
            sleep 5
          done
          exit 1
