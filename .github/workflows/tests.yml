name: 測試

on:
  push:
    # 只在程式有變動時跑。排程每天會 commit 幾十次 state.json 與 calendar.ics，
    # 不加這個過濾的話，每一個機器 commit 都會觸發一次測試。
    paths:
      - '**.py'
      - 'tests/fixtures/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt pytest

      # 測試不碰網路、不送 Telegram，所以不需要任何 secrets
      - run: python -m pytest -v
