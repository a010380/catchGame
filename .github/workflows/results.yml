name: 推播賽果

on:
  schedule:
    # 全天每 30 分鐘檢查一次。
    #
    # 原本只跑 MLB 的結束時段（UTC 18:00-08:00），但加入 CPBL 與電競後，
    # 各聯賽的結束時間幾乎鋪滿一整天：
    #   LCK   台灣 13:00-16:00 開打 -> UTC 09:00-13:00 結束
    #   CPBL  台灣 18:35 開打      -> UTC 13:00-16:00 結束
    #   MLB   美國晚間開打          -> UTC 18:00-08:00 結束
    # 留空檔會讓那個時段結束的比賽漏推，所以改成全天候。
    # repo 是公開的，Actions 分鐘數無上限，不必省這個。
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  notify-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 檢查並推播賽果
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py results

      - name: Commit 推播紀錄
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "推播紀錄無變化，跳過 commit。"
            exit 0
          fi
          git commit -m "chore: 更新賽果推播紀錄"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗，第 $i 次重試…"
            sleep 5
          done
          exit 1
