name: 推播賽果

on:
  schedule:
    # 每 30 分鐘檢查一次，但只在 MLB 可能有比賽結束的時段執行。
    # MLB 開賽集中在 UTC 16:00-02:00，所以比賽結束落在 UTC 18:00 到隔天 08:00。
    # 只跑這段可以把私人 repo 的 Actions 用量壓在免費額度內（見 README）。
    - cron: '*/30 18-23 * * *'
    - cron: '*/30 0-8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  notify-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 檢查並推播賽果
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py results

      - name: Commit 推播紀錄
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "推播紀錄無變化，跳過 commit。"
            exit 0
          fi
          git commit -m "chore: 更新賽果推播紀錄"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗，第 $i 次重試…"
            sleep 5
          done
          exit 1
