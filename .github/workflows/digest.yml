name: 今日賽事摘要

on:
  schedule:
    # 掛三個時間點：UTC 21/22/23 = 台灣時間 05:00 / 06:00 / 07:00。
    #
    # 不是要送三次 —— 程式自己會擋（config.DIGEST_NOT_BEFORE 預設 06:30，
    # 而且記錄今天是否已送過），所以實際只會送一次。
    #
    # 為什麼要三個：GitHub 的排程會遲到，實測這個 workflow 遲了 103-118 分鐘。
    # 只掛一個時間點就得賭遲到幅度不變；掛三個之後，不管 GitHub 遲到
    # 0 到 2 小時，都會有一次落在 06:30 之後而被送出。
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 推播今日賽程
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py digest
