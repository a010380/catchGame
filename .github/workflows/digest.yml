name: 今日賽事摘要

on:
  schedule:
    # 掛三個時間點：UTC 19/20/21 = 台灣時間 03:00 / 04:00 / 05:00。
    #
    # 不是要送三次 —— 程式自己會擋（config.DIGEST_NOT_BEFORE 預設 06:00，
    # 而且記錄今天是否已送過），所以實際只會送一次。
    #
    # 為什麼掛這麼早：GitHub 在這個時段的排程常遲到 3 小時（原本掛 05-07 點，
    # 實際都在 08:00-11:00 才跑）。掛早一點、早到的話就在 wait 這個 job
    # 原地等到 06:00 再送；遲到的話也還有後面兩槍。
    #
    # 另外 notify.yml 每次跑 tick 也會檢查摘要，過了 06:00 還沒送就會順手送出。
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

# 要把 state.json 的「今天已送過」紀錄 commit 回 repo，所以需要寫入權限。
# 沒有這一步的話去重根本不會生效 —— Actions 的執行環境用完即丟，寫進檔案
# 的紀錄會跟著消失，下一槍 cron 又會當成今天還沒送過。
permissions:
  contents: write

jobs:
  # 早到就等到 DIGEST_NOT_BEFORE。這個 job 不加入 notify 群組，
  # 等待的這段時間不會擋住開賽提醒與賽果。
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: 等到摘要時間
        run: |
          seconds=$(python -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import config
          now = datetime.now(ZoneInfo(config.TIMEZONE))
          h, _, m = config.DIGEST_NOT_BEFORE.partition(':')
          target = now.replace(hour=int(h), minute=int(m or 0), second=0, microsecond=0)
          print(max(0, int((target - now).total_seconds())))
          ")
          echo "距離摘要時間還有 ${seconds} 秒。"
          sleep "${seconds}"

  digest:
    needs: wait
    runs-on: ubuntu-latest
    concurrency:
      # 跟 notify.yml 共用同一個群組：兩邊都會 commit state.json，同時跑會互推衝突。
      group: notify
      cancel-in-progress: false
    steps:
      # 指定分支名稱 = 抓分支「現在」的最新版本。不指定的話會抓觸發當下的 commit，
      # 排隊等了幾小時才開始跑時，拿到的是舊的 state.json，已送過的通知會重送一遍。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 推播今日賽程
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py digest

      - name: Commit 摘要紀錄
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "摘要紀錄無變化，跳過 commit。"
            exit 0
          fi
          git commit -m "chore: 更新摘要紀錄"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗，第 $i 次重試…"
            sleep 5
          done
          exit 1
