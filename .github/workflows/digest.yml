name: 今日賽事摘要

on:
  schedule:
    # 掛三個時間點：UTC 21/22/23 = 台灣時間 05:00 / 06:00 / 07:00。
    #
    # 不是要送三次 —— 程式自己會擋（config.DIGEST_NOT_BEFORE 預設 06:30，
    # 而且記錄今天是否已送過），所以實際只會送一次。
    #
    # 為什麼要三個：GitHub 的排程會遲到，實測這個 workflow 遲了 103-118 分鐘。
    # 只掛一個時間點就得賭遲到幅度不變；掛三個之後，不管 GitHub 遲到
    # 0 到 2 小時，都會有一次落在 06:30 之後而被送出。
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

# 要把 state.json 的「今天已送過」紀錄 commit 回 repo，所以需要寫入權限。
# 沒有這一步的話去重根本不會生效 —— Actions 的執行環境用完即丟，寫進檔案
# 的紀錄會跟著消失，下一槍 cron 又會當成今天還沒送過。
permissions:
  contents: write

concurrency:
  # 跟 notify.yml 共用同一個群組：兩邊都會 commit state.json，同時跑會互推衝突。
  group: notify
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 推播今日賽程
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py digest

      - name: Commit 摘要紀錄
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "摘要紀錄無變化，跳過 commit。"
            exit 0
          fi
          git commit -m "chore: 更新摘要紀錄"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗，第 $i 次重試…"
            sleep 5
          done
          exit 1
