name: 更新賽程行事曆

on:
  schedule:
    # 每 6 小時跑一次（UTC 02:00 / 08:00 / 14:00 / 20:00）。
    #
    # 一天一次也能運作，但季後賽的對戰組合是打完上一輪才確定的
    # （行事曆上會先顯示 "TBD vs GEN"），多跑幾次可以讓隊名早點補上。
    # 賽程沒變動時 workflow 會跳過 commit，所以不會產生雜訊。
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:        # 允許在 Actions 頁面手動點「Run workflow」立即測試

# 需要寫入權限，因為產生的 .ics 要 commit 回 repo 給 GitHub Pages 發布
permissions:
  contents: write

concurrency:
  # 避免跟自己的上一輪執行同時 push 造成衝突
  group: calendar
  cancel-in-progress: false

jobs:
  build-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 產生 calendar.ics
        run: python main.py calendar

      - name: Commit 更新後的行事曆
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          # 賽程沒變動時不要產生空 commit
          if git diff --staged --quiet; then
            echo "賽程無變化，跳過 commit。"
            exit 0
          fi
          git commit -m "chore: 更新賽程行事曆 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # 另一個 workflow 可能剛推了 state.json，先 rebase 再推
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 失敗，第 $i 次重試…"
            sleep 5
          done
          exit 1
